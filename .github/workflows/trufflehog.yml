name: Secret Scanning
 
on:
  pull_request:
    branches:
      - main
 
permissions:
  contents: read
 
jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Scan current files
        run: |
          rm -rf .git
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --fail \
            --no-verification \
            --results=unverified